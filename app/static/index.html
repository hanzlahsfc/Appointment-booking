<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GVCW Appointment Slot Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
      colors: {
        surface:  { DEFAULT: '#020617', card: '#0F172B', elevated: '#1E293B', border: '#334155' },
        accent:   { DEFAULT: '#22C55E', muted: '#15803D', light: '#BBF7D0' },
        warn:     { DEFAULT: '#F59E0B', light: '#FEF3C7' },
        danger:   { DEFAULT: '#EF4444', light: '#FEE2E2' },
      }
    }
  }
}
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.4} }
  .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
  @keyframes fade-in { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation: fade-in .3s ease-out; }
</style>
</head>
<body class="bg-surface min-h-screen text-slate-100 antialiased">

<!-- ───── top bar ───── -->
<header class="sticky top-0 z-40 backdrop-blur-md bg-surface/80 border-b border-surface-border">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-accent/20 flex items-center justify-center">
        <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2"/><circle cx="12" cy="12" r="10"/></svg>
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight">GVCW Appointment Slot Monitor</h1>
        <p class="text-xs text-slate-400" id="subtitle">Connecting...</p>
      </div>
    </div>
    <div class="flex items-center gap-4 text-xs text-slate-400">
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-accent pulse-dot" id="live-dot"></span><span id="live-label">LIVE</span></span>
      <span class="hidden sm:inline" id="uptime-badge"></span>
      <span class="hidden sm:inline" id="poll-badge"></span>
      <span id="demo-badge" class="hidden px-2 py-0.5 rounded-full bg-warn/10 text-warn text-xs font-semibold tracking-wide">DEMO</span>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">

  <!-- ───── profile cards ───── -->
  <section>
    <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3 flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zm-4 7a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      Worker Profiles
    </h2>
    <div id="profiles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </section>

  <!-- ───── active slots table ───── -->
  <section>
    <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3 flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Active Slots
      <span class="ml-1 px-1.5 py-0.5 text-[10px] font-bold rounded bg-accent/10 text-accent" id="slots-count">0</span>
    </h2>
    <div class="overflow-x-auto rounded-xl border border-surface-border bg-surface-card">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-xs text-slate-500 border-b border-surface-border bg-surface">
          <th class="px-4 py-2.5 font-medium">Profile</th>
          <th class="px-4 py-2.5 font-medium">Category</th>
          <th class="px-4 py-2.5 font-medium">VAC</th>
          <th class="px-4 py-2.5 font-medium">Date</th>
          <th class="px-4 py-2.5 font-medium">Time</th>
        </tr></thead>
        <tbody id="slots-body" class="divide-y divide-surface-border"></tbody>
      </table>
      <div id="slots-empty" class="px-4 py-8 text-center text-sm text-slate-500">No slots detected yet.</div>
    </div>
  </section>

  <!-- ───── alert feed ───── -->
  <section>
    <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3 flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      Recent Alerts
      <span class="ml-1 px-1.5 py-0.5 text-[10px] font-bold rounded bg-warn/10 text-warn" id="alerts-count">0</span>
    </h2>
    <div class="rounded-xl border border-surface-border bg-surface-card overflow-hidden">
      <div id="alerts-body" class="divide-y divide-surface-border"></div>
      <div id="alerts-empty" class="px-4 py-8 text-center text-sm text-slate-500">No alerts yet. New slots will appear here.</div>
    </div>
  </section>

</main>

<footer class="text-center text-[11px] text-slate-600 py-6">GVCW Slot Monitor — auto-refreshes every 2 s</footer>

<script>
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const fmtDate = d => d || '—';
const fmtTime = t => t || 'Any';
const fmtUptime = s => {
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return [h,m,sec].map(n => String(n).padStart(2,'0')).join(':');
};
const fmtAgo = ts => {
  const diff = Math.max(0, Date.now()/1000 - ts);
  if (diff < 60)   return `${Math.floor(diff)}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  return `${Math.floor(diff/3600)}h ago`;
};
const BADGE_OK  = '<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-accent/10 text-accent text-[10px] font-bold"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>OK</span>';
const BADGE_ERR = '<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-danger/10 text-danger text-[10px] font-bold"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>ERR</span>';
const BADGE_SENT   = '<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-accent/10 text-accent text-[10px] font-bold"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>SENT</span>';
const BADGE_FAILED = '<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-danger/10 text-danger text-[10px] font-bold"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>FAILED</span>';

function renderProfiles(profiles){
  if(!profiles.length){ $('#profiles-grid').innerHTML = '<p class="text-sm text-slate-500">No worker profiles configured.</p>'; return; }
  $('#profiles-grid').innerHTML = profiles.map(p => `
    <div class="rounded-xl border border-surface-border bg-surface-card p-4 fade-in">
      <div class="flex items-start justify-between gap-2 mb-2">
        <div class="min-w-0">
          <p class="font-semibold text-sm truncate">${esc(p.name)}</p>
          <p class="text-xs text-slate-500 truncate mt-0.5">${esc(catLabel(p.category))} &middot; ${esc(p.location||'')}</p>
        </div>
        <span class="shrink-0 mt-0.5">${p.error ? BADGE_ERR : BADGE_OK}</span>
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs mt-3">
        <div class="rounded-lg bg-surface p-2"><span class="text-slate-500">Slots</span><p class="font-bold text-accent">${p.slots_count ?? '—'}</p></div>
        <div class="rounded-lg bg-surface p-2"><span class="text-slate-500">New (this poll)</span><p class="font-bold ${p.new_count ? 'text-warn' : 'text-slate-400'}">${p.new_count ?? 0}</p></div>
        <div class="rounded-lg bg-surface p-2 col-span-2"><span class="text-slate-500">Last poll</span><p class="font-medium text-slate-300">${p.last_poll ? fmtAgo(p.last_poll) : '—'} ${p.duration != null ? '<span class="text-slate-600">(' + p.duration.toFixed(1) + 's)</span>' : ''}</p></div>
      </div>
      ${p.error ? `<p class="mt-2 text-[11px] text-danger truncate" title="${esc(p.error)}">⚠ ${esc(p.error)}</p>` : ''}
    </div>
  `).join('');
}

function renderSlots(slotsMap){
  const all = Object.values(slotsMap).flat().sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.time||'').localeCompare(b.time||''));
  $('#slots-count').textContent = all.length;
  if(!all.length){ $('#slots-body').innerHTML = ''; $('#slots-empty').classList.remove('hidden'); return; }
  $('#slots-empty').classList.add('hidden');
  $('#slots-body').innerHTML = all.map(s => `
    <tr class="hover:bg-surface/40 transition-colors">
      <td class="px-4 py-2.5 text-slate-300 text-sm">${esc(s.profile)}</td>
      <td class="px-4 py-2.5"><span class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold bg-accent/10 text-accent">${esc(catLabel(s.category))}</span></td>
      <td class="px-4 py-2.5 text-slate-400 text-sm capitalize">${esc(s.location)}</td>
      <td class="px-4 py-2.5 font-medium text-slate-200">${fmtDate(s.date)}</td>
      <td class="px-4 py-2.5 text-slate-400">${fmtTime(s.time)}</td>
    </tr>
  `).join('');
}

function renderAlerts(alerts){
  $('#alerts-count').textContent = alerts.length;
  if(!alerts.length){ $('#alerts-body').innerHTML = ''; $('#alerts-empty').classList.remove('hidden'); return; }
  $('#alerts-empty').classList.add('hidden');
  $('#alerts-body').innerHTML = alerts.slice(0,50).map(a => `
    <div class="px-4 py-2.5 flex items-center gap-3 text-sm hover:bg-surface/40 transition-colors">
      <span class="text-xs text-slate-600 w-20 shrink-0" title="${new Date(a.ts*1000).toLocaleString()}">${fmtAgo(a.ts)}</span>
      <span class="text-slate-300 truncate w-32 shrink-0">${esc(a.profile)}</span>
      <span class="text-slate-500 truncate w-24 hidden sm:inline">${esc(a.category)}</span>
      <span class="text-slate-400 text-xs hidden md:inline">${esc(a.location)} &middot; ${fmtDate(a.date)}</span>
      <span class="ml-auto shrink-0">${a.status==='sent' ? BADGE_SENT : BADGE_FAILED}</span>
    </div>
  `).join('');
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const CAT_LABELS = {
  'national_d_employment': 'Work Permit',
  'national_d_seasonal':   'Premiere Launch',
  'national_d':            'National D Visa',
  'schengen_c':            'Schengen C',
  'attestation':           'Attestation'
};
const catLabel = c => CAT_LABELS[c] || (c||'—');

async function poll(){
  try {
    const r = await fetch('/api/status');
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    $('#subtitle').textContent = `${d.profiles.length} profile(s) · poll every ${d.config?.poll ?? '—'}s`;
    $('#uptime-badge').textContent = 'up ' + fmtUptime(d.uptime);
    $('#poll-badge').textContent = (d.config?.poll ?? '—') + 's interval';
    $('#demo-badge').classList.toggle('hidden', !d.config?.demo);
    const profiles = d.profiles.map(p => {
      const s = d.slots[p.name] || [];
      return { ...p, slots_count: s.length, new_count: p.new_count };
    });
    renderProfiles(profiles);
    renderSlots(d.slots);
    renderAlerts(d.alerts);
    $('#live-dot').classList.remove('bg-danger');
    $('#live-dot').classList.add('bg-accent');
  } catch(e) {
    $('#live-dot').classList.add('bg-danger');
    $('#live-dot').classList.remove('bg-accent');
    $('#live-label').textContent = 'OFFLINE';
  }
}
setInterval(poll, 2000);
poll();
</script>
</body>
</html>
