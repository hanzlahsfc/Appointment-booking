<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appointment Booker</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<section id="login-view" class="center-card">
  <form id="login-form" class="card">
    <h1>Appointment Booker</h1>
    <p class="muted">Enter your access code</p>
    <input id="login-code" type="password" autocomplete="off"
           placeholder="ab-xxxx-xxxx-…" required>
    <button type="submit">Sign in</button>
    <p id="login-error" class="error"></p>
  </form>
</section>

<section id="main-view" class="hidden">
  <header>
    <div>
      <h1>Appointment Booker</h1>
      <span id="client-name" class="muted"></span>
    </div>
    <div class="header-actions">
      <span id="conn" class="pill">offline</span>
      <button id="btn-sound" class="ghost" title="Enable booking alert sound">Enable sound</button>
      <button id="btn-test-sound" class="ghost hidden">Test</button>
      <button id="btn-home" title="Open the portal page">Portal page</button>
      <button id="btn-control">Take control</button>
      <button id="btn-logout" class="ghost">Sign out</button>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main>
    <div id="screen-wrap">
      <img id="screen" alt="remote browser" draggable="false">
      <div id="screen-overlay" class="overlay">connecting…</div>
    </div>

    <aside>
      <div class="card">
        <h2>Monitoring</h2>
        <div id="monitor-status" class="muted">—</div>
        <div id="monitor-metrics" class="muted small"></div>
        <div id="booking-status"></div>
        <div id="booking-actions" class="hidden">
          <button id="btn-ack">Acknowledge alert</button>
          <button id="btn-finished" class="ghost">I completed the booking</button>
        </div>
        <div id="otp-actions" class="hidden">
          <button id="btn-otp-request">Request SMS code</button>
          <input id="otp-code" type="text" inputmode="numeric" maxlength="8" placeholder="SMS code" autocomplete="off">
          <button id="btn-otp-send" class="ghost">Enter code</button>
          <button id="btn-confirm-book" class="danger">Confirm and book</button>
        </div>
      </div>
      <div class="card">
        <h2>Open slots <span id="slot-count" class="muted"></span></h2>
        <ul id="slots" class="feed"></ul>
      </div>
      <div class="card">
        <h2>Alerts</h2>
        <ul id="alerts" class="feed"></ul>
      </div>
      <div class="card">
        <h2>Bookings</h2>
        <ul id="bookings" class="feed"></ul>
      </div>
    </aside>
  </main>
</section>

<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
