app:
  poll_interval_seconds: 300     # 5 min base
  jitter_seconds: 30             # +/- random delay
  concurrency: 4                 # max simultaneous browser contexts
  timezone: "Asia/Karachi"
  dry_run: false                 # true = check + log, NO emails
  headless: true                 # set false during recon pass

  # Auto-booking. Left OFF deliberately: `assist` makes the crawler claim the
  # slot and alarm you to finish the form; `auto` also submits unattended.
  booking:
    mode: "off"                  # off | assist | auto
    dry_run: true                # true = walk the flow, never click reserve
    alarm_seconds: 120           # how long the local alarm keeps repeating
    headless: false              # assist needs a visible browser window
    max_attempts_per_profile_per_hour: 4

# Optional: route browser traffic through a (recommended: residential) proxy
# to escape IP-reputation blocks from Imperva/Incapsula.
# network:
#   proxy: "socks5://user:pass@host:1080"   # or http://host:3128

profiles:
  - name: "Ahmed - Work Permit"
    email: "alerts@gvcwclient.example"
    category: "national_d_employment"
    location: "lahore"
    booking_url: "https://pk-gr-services.gvcworld.eu/login/appointments"

  - name: "Ahmed - Premiere Launch"
    email: "alerts@gvcwclient.example"
    category: "national_d_seasonal"
    location: "islamabad"
    booking_url: "https://pk-gr-services.gvcworld.eu/login/appointments"

notifications:
