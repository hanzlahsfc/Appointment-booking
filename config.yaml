app:
  poll_interval_seconds: 300     # 5 min base
  jitter_seconds: 30             # +/- random delay
  concurrency: 4                 # max simultaneous browser contexts
  timezone: "Asia/Karachi"
  dry_run: false                 # true = check + log, NO emails
  headless: true                 # set false during recon pass

# Optional: route browser traffic through a (recommended: residential) proxy
# to escape IP-reputation blocks from Imperva/Incapsula.
# network:
#   proxy: "socks5://user:pass@host:1080"   # or http://host:3128

